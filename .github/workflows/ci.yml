name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publint (package quality)
        run: npx publint

      - name: npm pack (inspect tarball)
        run: |
          npm pack --dry-run
          npm pack
          tar -tzf igrs-circahue-*.tgz | head -40

  test:
    name: Test (Node ${{ matrix.node }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke import (ESM)
        run: |
          node --input-type=module -e "
            import { sampleLightHue } from './dist/index.js';
            const s = sampleLightHue({ hourOverride: 12, season: 'summer' });
            if (!s.accent.hex.startsWith('#')) throw new Error('bad accent');
            console.log('ok', s.phaseLabel, s.accent.hex);
          "
